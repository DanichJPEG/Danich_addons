schema_version = "1.0.0"

# FFlex as a Blender extension (Blender 4.2+ extensions, built for 5.0+).
# The `id` MUST equal the directory name: src/fflex/
# Blender imports the installed package as bl_ext.<repository_id>.fflex

id = "fflex"
version = "1.5.1"
name = "FFlex"
tagline = "Fit edge loops onto an editable imaginary curve"
maintainer = "DanichJpeg"
type = "add-on"

blender_version_min = "4.5.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

website = "https://github.com/DanichJPEG/Fflex"
